[package]
name = "dsh-shell"
version = "0.1.6"
description = "Unofficial desktop shell that embeds the DeepSeek Harness web UI in a native window"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
  "Win32_System_JobObjects",
  "Win32_System_Threading",
  "Win32_Security",
  "Win32_Foundation",
] }

[profile.release]
strip = true
lto = true
codegen-units = 1
